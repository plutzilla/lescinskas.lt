name: Publish lescinskas.lt Docker container to GHCR

on:
  workflow_call:

jobs:
  publish:
    name: Publish Docker image to GitHub Container Registry (GHCR)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Download minified website artifact
        uses: actions/download-artifact@v8
        with:
          name: website-minified
          path: _site
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./nginx.Dockerfile
          push: true
          tags: ghcr.io/plutzilla/lescinskas-lt-website:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}
